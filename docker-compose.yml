version: '3.8'

services:
  c1-postgres-gate:
    image: postgres:16-alpine
    container_name: chandanala-c1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ChandanalaERP_C1_Gate
      POSTGRES_USER: ${C1_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${C1_DB_PASSWORD:-postgres_c1_secret}
    ports:
      - "5432:5432"
    volumes:
      - c1_postgres_data:/var/lib/postgresql/data
      # Mount baseline script directly into container entrypoint for cold init
      - ./artifacts/c1_canonical_baseline.sql:/docker-entrypoint-initdb.d/01_baseline.sql:ro
    command: >
      postgres 
      -c log_connections=on 
      -c log_disconnections=on 
      -c log_statement=all 
      -c synchronous_commit=on

volumes:
  c1_postgres_data:
    driver: local
