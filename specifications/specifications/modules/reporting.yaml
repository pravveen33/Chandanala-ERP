    daily:
      enabled: true

    supplier_performance:
      enabled: true

    purchase_analysis:
      enabled: true

  inventory:

    stock_position:
      enabled: true

    batch_report:
      enabled: true

    expiry_report:
      enabled: true

    near_expiry:
      enabled: true

    dead_stock:
      enabled: true

    stock_valuation:
      enabled: true

  finance:

    trial_balance:
      enabled: true

    profit_loss:
      enabled: true

    balance_sheet:
      enabled: true

    cash_flow:
      enabled: true

    customer_ledger:
      enabled: true

    supplier_ledger:
      enabled: true

    cash_book:
      enabled: true

    bank_book:
      enabled: true

