version: "1.0"

module:
  id: customer
  name: Customer Management
  description: Customer master and relationship management

enabled: true

dependencies:
  - identity
  - audit
  - medicine
  - sales
  - finance

masters:

  customer:
    enabled: true

  customer_group:
    enabled: true

  customer_category:
    enabled: true

  address:
    enabled: true

  contact:
    enabled: true

features:

  customer_registration:
    enabled: true

  customer_search:
    enabled: true

  prescription_history:
    enabled: true

  purchase_history:
    enabled: true

  family_accounts:
    enabled: true

  loyalty_program:
    enabled: true

  reward_points:
    enabled: true

  wallet:
    enabled: true

  whatsapp_notifications:
    enabled: true

  sms_notifications:
    enabled: true

credit_management:

  enabled: true

  credit_limit:
    enabled: true

  credit_days:
    enabled: true

  outstanding_tracking:
    enabled: true

  ageing_analysis:
    enabled: true

  payment_history:
    enabled: true

  statement_generation:
    enabled: true

medical_profile:

  allergies:
    enabled: true

  chronic_conditions:
    enabled: true

  preferred_doctor:
    enabled: true

  preferred_pharmacy:
    enabled: true

governance:

  allow_delete: false

  require_mobile_number: true

  require_unique_customer_code: true

  require_audit: true

privacy:

  consent_required: true

  mask_sensitive_information: true

roles:

  - Administrator
  - Pharmacist
  - Cashier
  - Customer Service
  - Auditor

audit:

  enabled: true

health:

  enabled: true