# /specs/competitive-benchmark/controls/INV-001.yaml

control_id: INV-001
domain: Inventory / WMS
capability: Batch-Aware Pharmaceutical Inventory
capability_question: >
  Can the system track pharmaceutical batch/lot, expiry, FEFO-relevant state,
  godown/location, manufacturer, quantity, and blocked/recalled state?
control_question: >
  Is explicit authorization required before restricted stock is adjusted,
  released, transferred, or otherwise mutated when policy prohibits the action?
benchmark:
  description: >
    The system must maintain authoritative pharmaceutical inventory state
    across batch/lot, expiry, location, manufacturer, quantity, and applicable
    blocked/recalled status. Allocation and mutation must obey deterministic
    inventory and regulatory rules.
