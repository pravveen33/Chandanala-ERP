# /specs/competitive-benchmark/controls/PROC-001.yaml

control_id: PROC-001
domain: Procurement
capability: AI-Assisted Purchase Order Generation
capability_question: >
  Can AI recommend or draft purchase orders based on inventory, demand,
  supplier, pricing, and policy signals?
control_question: >
  Can an AI agent create or finalize an authoritative procurement commitment
  without the required ΩA authorization and execution controls?
benchmark:
  description: >
    AI may analyze procurement data and draft or automate eligible procurement
    workflows. Authoritative purchasing commitments must remain subject to the
    platform's defined authorization, policy, segregation-of-duties, and
    execution controls.
