# /specs/competitive-benchmark/controls/FIN-001.yaml

control_id: FIN-001
domain: Finance
capability: Authoritative General Ledger
capability_question: >
  Can the system support authoritative double-entry general ledger posting?
control_question: >
  Does the system enforce balanced ledger posting and prevent unauthorized
  authoritative ledger mutations, with cryptographic evidence used for
  integrity/provenance rather than as a substitute for accounting controls?
benchmark:
  description: >
    The system must enforce double-entry accounting principles such that every
    authoritative posting is balanced according to the applicable accounting
    rules. Authorization and integrity controls must prevent unauthorized
    authoritative mutations. Cryptographic evidence may establish integrity and
    provenance but does not itself enforce accounting balance.
