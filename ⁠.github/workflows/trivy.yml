name: "Trivy Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * *'   # daily — CVE databases change even when your code doesn't
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: chandanala-erp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  filesystem-scan:
    name: Scan repo (NuGet deps + IaC + misconfig)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Trivy parses .csproj PackageReference entries directly (no dotnet restore
      # or packages.lock.json needed) — this will pick up EntityFrameworkCore,
      # Npgsql, and every other NuGet package in Chandanala.ERP.Web.csproj.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0   # don't fail the job here; the quality-gate job below enforces the gate

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  image-scan:
    name: Scan Docker image (OS packages + CVEs)
    runs-on: ubuntu-latest
    needs: filesystem-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # Hard gate: fail the build on CRITICAL/HIGH so the PR check actually blocks merge.
      - name: Enforce severity gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true