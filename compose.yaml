services:
  postgres:
    image: postgres:16
    container_name: chandanala-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ChandanalaERP
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123456

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ChandanalaERP"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: src/Chandanala.ERP.Web/Dockerfile

    container_name: chandanala-core

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ChandanalaERP;Username=postgres;Password=Admin123456

    ports:
      - "8080:8080"

volumes:
  postgres-data:
