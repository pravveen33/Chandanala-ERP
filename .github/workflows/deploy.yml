name: Chandanala Core ERP - Build & Verify CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore Chandanala-ERP/Chandanala.ERP.sln

    - name: Build ERP Solution
      run: dotnet build Chandanala-ERP/Chandanala.ERP.sln --configuration Release --no-restore

    - name: Run Verification Script
      run: |
        chmod +x ./chandanala-verify.sh
        ./chandanala-verify.sh
      continue-on-error: false
