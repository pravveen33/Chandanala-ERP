name: CHANDANALA CORE Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore "CHANDANALA CORE.slnx"

      - name: Build Solution (Release)
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test "CHANDANALA CORE.slnx" --configuration Release --no-build --verbosity normal

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker Image
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/chandanala-core:latest -f src/Chandanala.WebAPI/Dockerfile .

      - name: Push Docker Image to GCR
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/chandanala-core:latest

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloud-run@v2
        with:
          service: chandanala-core-api
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/chandanala-core:latest
          region: us-central1
          flags: '--allow-unauthenticated'
