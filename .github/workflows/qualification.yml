name: CHANDANALA CORE™ CI/CD Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  workflow_dispatch: 

jobs:
  build-and-qualify:
    name: CI/CD Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository Boundary
        uses: actions/checkout@v4

      - name: 2. Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Restore dependencies
        # FIX: Explicitly targeting the solution file to resolve MSB1011
        run: dotnet restore "CHANDANALA CORE.slnx"

      - name: 4. Build
        # FIX: Explicitly targeting the solution file
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: 5. Execute Tests & Generate Evidence
        # FIX: Running tests against the solution and capturing the raw .trx artifact
        run: dotnet test "CHANDANALA CORE.slnx" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=qualification_evidence_FINAL.trx" --results-directory ./evidence

      - name: 6. Upload Immutable Evidence Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chandanala-qualification-bundle-${{ github.sha }}
          path: ./evidence/
          retention-days: 90
