name: Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:

  documentation:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Chandanala.ERP.sln

      - name: Build
        run: dotnet build Chandanala.ERP.sln --configuration Release

      - name: Generate XML Documentation
        run: |
          dotnet build \
            -p:GenerateDocumentationFile=true \
            Chandanala.ERP.sln

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            **/*.xml