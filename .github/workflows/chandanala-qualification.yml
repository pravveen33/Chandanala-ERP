name: CHANDANALA CORE™ Empirical Qualification

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  # Allows you to trigger the pipeline manually from your iPhone via Working Copy / GitHub app
  workflow_dispatch: 

jobs:
  execute-falsification-oracles:
    name: Execute Execution Boundaries (ΩX/ΩE)
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository Boundary
        uses: actions/checkout@v4

      - name: 2. Setup .NET 9 Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 3. Boot Physical PostgreSQL/PLV8 Substrate
        run: |
          echo "Booting isolated execution enclave..."
          cd test_infrastructure
          docker compose up -d
          
          echo "Awaiting database healthcheck..."
          # Wait for PostgreSQL to fully initialize and apply V001-V003 DDL migrations
          until docker exec chandanala_qualification_db pg_isready -U chandanala_infra_admin -d chandanala_test_db; do
            sleep 2
          done
          echo "Substrate booted and schema applied."

      - name: 4. Anchor External Truth (JCS Corpus Provenance)
        run: |
          chmod +x ./scripts/fetch_and_pin_corpus.sh
          ./scripts/fetch_and_pin_corpus.sh
          # The script produces corpus_provenance.sha256 in the root directory

      - name: 5. Execute Falsification Oracles (X-Series & L-Series)
        id: execute_tests
        run: |
          echo "Executing physical consequence boundaries..."
          # We use `continue-on-error` or bash logical OR to ensure we ALWAYS collect evidence, even on failure
          dotnet test src/Chandanala.Qualification.Oracles/Chandanala.Qualification.Oracles.csproj \
            --logger "trx;LogFileName=qualification_evidence_FINAL.trx" \
            --results-directory ./evidence || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: 6. Extract Database Enclave Forensic Logs
        if: always()
        run: |
          echo "Extracting PostgreSQL transaction logs and constraint violations..."
          docker logs chandanala_qualification_db > ./evidence/postgresql_transaction.log

      - name: 7. Cryptographic Anchoring of Evidence
        if: always()
        run: |
          echo "Generating WORM hashes for all physical artifacts..."
          cd evidence
          
          # Hash the test results
          if [ -f "qualification_evidence_FINAL.trx" ]; then
            sha256sum qualification_evidence_FINAL.trx > qualification_evidence.sha256
          fi
          
          # Hash the DB logs
          sha256sum postgresql_transaction.log > db_logs.sha256
          
          # Move corpus hash into evidence folder for bundling
          mv ../corpus_provenance.sha256 ./ || true

      - name: 8. Upload Immutable Evidence Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chandanala-qualification-bundle-${{ github.sha }}
          path: ./evidence/
          retention-days: 90

      - name: 9. Enforce Strict Pipeline Verdict
        if: env.TESTS_FAILED == 'true'
        run: |
          echo "::error::Falsification Oracles FAILED. The execution boundary was breached or tests did not pass."
          echo "Download the 'chandanala-qualification-bundle' artifact to independently verify the .trx and database logs."
          exit 1
