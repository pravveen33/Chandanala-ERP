name: Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "CHANDANALA CORE.slnx"

      - name: Build
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test "CHANDANALA CORE.slnx"
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
