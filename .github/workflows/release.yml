name: Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "CHANDANALA CORE.slnx"

      - name: Build
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish "src/Chandanala.ERP.Web/Chandanala.ERP.Web.csproj" `
            --configuration Release `
            --output publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
