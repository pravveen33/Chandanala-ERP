on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore CHANDANALA\ CORE.slnx

      - name: Build
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "CHANDANALA CORE.slnx" --configuration Release --no-build