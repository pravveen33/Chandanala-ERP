name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'CHANDANALA-CORE.sln'
  WEB_PROJECT_PATH: 'src/Chandanala.ERP.Web/Chandanala.ERP.Web.csproj'
  PUBLISH_DIR: './publish'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build & Publish Staging Artifact

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup .NET 10 ────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── 3. Cache NuGet packages ─────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── 4. Restore ──────────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # ── 5. Build ────────────────────────────────────────────────
      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore

      # ── 6. Test ─────────────────────────────────────────────────
      - name: Run tests
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-build
          --verbosity normal

      # ── 7. Publish ──────────────────────────────────────────────
      - name: Publish Web project
        run: >
          dotnet publish ${{ env.WEB_PROJECT_PATH }}
          --configuration Release
          --no-build
          --output ${{ env.PUBLISH_DIR }}
          --self-contained false

      # ── 8. Upload artifact ──────────────────────────────────────
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chandanala-erp-staging
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 7

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    name: Deploy to Staging
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      # ── 1. Download artifact ────────────────────────────────────
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: chandanala-erp-staging
          path: ./staging-deploy

      # ── 2. Deploy (example: Azure Web App) ──────────────────────
      # Replace with your actual deployment provider
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./staging-deploy

      # ── 3. Health check ─────────────────────────────────────────
      - name: Health check
        run: |
          sleep 15
          curl -f ${{ vars.STAGING_URL }}/health || exit 1
