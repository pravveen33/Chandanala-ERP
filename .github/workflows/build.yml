name: Build and Validate ERP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore "CHANDANALA CORE.slnx"

      - name: Build Solution (Release)
        run: dotnet build "CHANDANALA CORE.slnx" --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test "CHANDANALA CORE.slnx" --configuration Release --no-build --verbosity normal

      - name: Check EF Core Model Changes
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/Chandanala.Infrastructure --startup-project src/Chandanala.WebAPI || echo "Model changes checked"
