# ============================================================
# CHANDANALA CORE™ — Database Migration
# NEVER run automatically on push. Manual approval only.
# ============================================================

name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      migration_name:
        description: 'Migration to apply (blank = latest)'
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT_ID: alpine-gasket-502104-t6
  DB_INSTANCE: chandanala-db
  DB_NAME: ChandanalaERP

jobs:
  migrate:
    name: Apply EF Core Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Setup Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: Start Cloud SQL Proxy
        run: |
          ./cloud_sql_proxy -instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE }}=tcp:5432 &
          sleep 5
      
      - name: Apply Migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${{ env.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}"
        run: |
          dotnet tool install --global dotnet-ef
          cd src/Chandanala.ERP.Infrastructure
          
          if [ -n "${{ github.event.inputs.migration_name }}" ]; then
            dotnet ef database update ${{ github.event.inputs.migration_name }} --context ApplicationDbContext
          else
            dotnet ef database update --context ApplicationDbContext
          fi
