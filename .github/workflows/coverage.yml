name: Test Coverage

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Chandanala.ERP.sln

      - name: Build
        run: dotnet build Chandanala.ERP.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test Chandanala.ERP.sln \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger trx

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: "**/coverage.cobertura.xml"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"