name: CHANDANALA CORE Build Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ # Adjust if your .csproj is in a subfolder

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Ensure this matches your .csproj version

      - name: Build
        run: dotnet build --configuration Release
