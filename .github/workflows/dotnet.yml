name: AI Provider Compatibility

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:

  provider-tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        provider:
          - openai
          - gemma
          - claude
          - ocr

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            --configuration $BUILD_CONFIGURATION \
            --no-restore

      - name: Provider Health Check
        run: |
          echo "Checking ${{ matrix.provider }}"

      - name: Capability Tests
        run: |
          echo "Capability validation"

      - name: Routing Tests
        run: |
          echo "Provider routing"

      - name: Embedding Tests
        run: |
          echo "Embedding validation"

      - name: Retrieval Tests
        run: |
          echo "Hybrid RAG retrieval"

      - name: Citation Tests
        run: |
          echo "Citation enforcement"

      - name: Validation Platform Tests
        run: |
          echo "Validation Platform"

      - name: Clinical Safety Tests
        run: |
          echo "Clinical Safety"

      - name: Audit Tests
        run: |
          echo "Audit Platform"

      - name: Performance Tests
        run: |
          echo "Latency benchmark"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.provider }}
          path: TestResults/