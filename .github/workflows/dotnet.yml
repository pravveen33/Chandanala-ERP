chandanala-core:

  version: 7.0

  platform:
    type: Pharmacy ERP

  ai:

    architecture: AgentOS

    semanticGrounding: true

    providerRouting: capability

    memory: true

    audit: true

    approval: true

    qualityFactory: true

  providers:

    planner:

      primary: claude

      fallback: gpt

    builder:

      primary: gpt

      fallback: local

    judge:

      primary: claude

      fallback: gpt

    vision:

      primary: gemini

      fallback: gpt

  factory:

    enabled: true

    maxRetries: 3

    minimumScore: 90

    confidenceThreshold: 0.90

    stages:

      - Director

      - Planner

      - Builder

      - PolicyValidator

      - ComplianceValidator

      - Judge

      - ConfidenceScorer

      - Approval

      - Audit

  semantic:

    ontology: true

    knowledgeGraph: true

    businessVocabulary: true

    semanticSearch: true

    grounding: true

    forecasting: true

  tools:

    protocol: MCP

    inventory:

      enabled: true

    purchase:

      enabled: true

    billing:

      enabled: true

    supplier:

      enabled: true

    customer:

      enabled: true

    reporting:

      enabled: true

    notifications:

      enabled: true

    ocr:

      enabled: true

  workflow:

    inventoryRecommendation:

      trigger:

        - LowStock

        - ExpiryRisk

      pipeline:

        - Planner

        - Builder

        - Judge

        - Approval

        - PurchaseOrder

        - Audit

    executiveSummary:

      trigger:

        - Daily

      pipeline:

        - Builder

        - Judge

        - Publish

    dashboardInsight:

      trigger:

        - DashboardRefresh

      pipeline:

        - Builder

        - Judge

        - Dashboard

  policies:

    cdsco: true

    gst: true

    scheduleH: true

    scheduleH1: true

    scheduleX: true

    pricing: true

    inventory: true

    procurement: true

    expiry: true

    audit: true

  quality:

    inventoryForecast:

      minimumScore: 95

    purchaseRecommendation:

      minimumScore: 95

    dashboardSummary:

      minimumScore: 90

    reportGeneration:

      minimumScore: 90

    codeGeneration:

      minimumScore: 95

  approval:

    purchaseOrder:

      required: true

    inventoryAdjustment:

      required: true

    priceChange:

      required: true

    financialPosting:

      required: true

    reportPublishing:

      required: false

  eventBus:

    enabled: true

    events:

      - InventoryChanged

      - PurchaseCreated

      - BillingCompleted

      - SupplierUpdated

      - ExpiryDetected

      - DashboardRefresh

  monitoring:

    prometheus: true

    opentelemetry: true

    auditDashboard: true

    aiMetrics: true

  database:

    postgres: true

    redis: true

    pgvector: true

    knowledgeVault: true