version: "1.0"

server:
  id: filesystem
  name: Filesystem MCP
  enabled: true

mode:
  readonly: true

roots:
  - ./docs
  - ./knowledge
  - ./architecture
  - ./specifications
  - ./prompts

blocked:
  - .git
  - .github/secrets
  - bin
  - obj
  - node_modules

permissions:
  read: true
  write: false
  delete: false

governance:
  audit_logging: true

security:
  follow_symlinks: false
  allow_hidden_files: false