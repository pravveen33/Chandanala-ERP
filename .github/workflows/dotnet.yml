# ==========================================================
# CHANDANALA CORE™
# Content-as-Code & KnowledgeOps Configuration
# Architecture v31.4
# ==========================================================

content-as-code:

  enabled: true

  governance:
    mandatory: true
    version-control: git
    pull-request-review: true
    approval-required: true
    audit-trail: true
    rollback-supported: true
    digital-signatures: true

  lifecycle:

    stages:
      - draft
      - review
      - validate
      - approve
      - version
      - deploy
      - monitor
      - archive

  repository:

    prompts: "/prompts"
    workflows: "/workflows"
    rules: "/rules"
    policies: "/policies"
    knowledge: "/knowledge"
    templates: "/templates"
    benchmark: "/benchmark"
    schemas: "/schemas"
    feature-flags: "/feature-flags"
    configurations: "/configs"
    governance: "/governance"
    documentation: "/docs"

content-registry:

  prompt:
    enabled: true
    owner: ai-team

  workflow:
    enabled: true
    owner: operations

  business-rule:
    enabled: true
    owner: business-team

  clinical-policy:
    enabled: true
    owner: pharmacist

  configuration:
    enabled: true
    owner: system-admin

  knowledge:
    enabled: true
    owner: knowledge-manager

  template:
    enabled: true

  report:
    enabled: true

  dashboard:
    enabled: true

  ai-benchmark:
    enabled: true

  feature-flag:
    enabled: true

metadata:

  required: true

  fields:

    id: required
    name: required
    category: required
    version: required
    owner: required
    reviewer: required
    approver: required
    status: required
    created-at: required
    updated-at: required
    effective-from: required
    expires-on: optional
    rollback-version: required
    checksum: required
    digital-signature: required
    tags: optional

approval-matrix:

  prompt:
    reviewer: ai-lead
    approver: technical-lead

  workflow:
    reviewer: process-owner
    approver: operations-manager

  business-rule:
    reviewer: operations
    approver: business-owner

  clinical-policy:
    reviewer: senior-pharmacist
    approver: compliance-officer

  configuration:
    reviewer: system-administrator
    approver: erp-administrator

  knowledge:
    reviewer: subject-expert
    approver: knowledge-manager

knowledge-retrieval:

  strategy:

    - business-rules
    - clinical-policies
    - approved-sop
    - knowledge-base
    - configuration
    - ai-reasoning

  cache:
    enabled: true

  vector-search:
    enabled: true

  citations:
    required: true

validation:

  schema-validation: true
  yaml-validation: true
  duplicate-detection: true
  broken-link-check: true
  policy-validation: true
  clinical-validation: true
  security-scan: true
  compliance-check: true
  ai-benchmark-validation: true

quality-gates:

  required:

    - schema-valid
    - metadata-valid
    - approval-complete
    - benchmark-passed
    - compliance-passed
    - security-passed

deployment:

  environments:

    development:
      auto-deploy: true

    staging:
      approval-required: true

    production:
      approval-required: true
      audit-required: true
      rollback-ready: true

git:

  branching:

    main: protected

    develop: protected

    feature:
      prefix: feature/

    hotfix:
      prefix: hotfix/

    release:
      prefix: release/

audit:

  enabled: true

  capture:

    - author
    - reviewer
    - approver
    - timestamp
    - previous-version
    - new-version
    - change-summary
    - rollback-reference
    - deployment-id

ai:

  content-awareness:

    prompts-as-code: true

    workflows-as-code: true

    policies-as-code: true

    rules-as-code: true

    knowledge-as-code: true

    benchmark-as-code: true

    configuration-as-code: true

monitoring:

  metrics:

    deployments: true

    approvals: true

    rollback-count: true

    validation-failures: true

    benchmark-results: true

    content-health-score: true

architecture:

  principles:

    - "Business Logic != AI Logic"
    - "Content is a First-Class Asset"
    - "Knowledge Before Generation"
    - "Policy Before Execution"
    - "Configuration Before Customization"
    - "Everything Versioned"
    - "Everything Auditable"
    - "Everything Rollbackable"

# ==========================================================
# CHANDANALA CORE™ Architecture Rule
#
# Source Code
# AI Prompts
# Business Rules
# Clinical Policies
# Workflows
# Knowledge
# Configuration
# Templates
# Benchmarks
# Feature Flags
#
# All are treated as governed software assets and follow
# the same lifecycle:
#
# Design → Review → Validate → Approve → Version →
# Deploy → Monitor → Improve → Archive
# ==========================================================