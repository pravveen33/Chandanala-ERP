name: Architecture Governance

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:

  governance:

    name: Architecture Governance Validation

    runs-on: ubuntu-latest

    services:

      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chandanala

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore

      - name: Verify Architecture Tests
        run: |
          if [ -d tests/Architecture.Tests ]; then
            dotnet test tests/Architecture.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          else
            echo "Architecture.Tests not found - skipping."
          fi

      - name: Verify AI Gateway Tests
        run: |
          if [ -d tests/AI.Gateway.Tests ]; then
            dotnet test tests/AI.Gateway.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          else
            echo "AI.Gateway.Tests not found - skipping."
          fi

      - name: Verify Knowledge Platform Tests
        run: |
          if [ -d tests/Knowledge.Tests ]; then
            dotnet test tests/Knowledge.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          else
            echo "Knowledge.Tests not found - skipping."
          fi

      - name: Verify Validation Platform Tests
        run: |
          if [ -d tests/Validation.Tests ]; then
            dotnet test tests/Validation.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          else
            echo "Validation.Tests not found - skipping."
          fi

      - name: Verify Clinical Safety Tests
        run: |
          if [ -d tests/ClinicalSafety.Tests ]; then
            dotnet test tests/ClinicalSafety.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          else
            echo "ClinicalSafety.Tests not found - skipping."
          fi

      - name: Prevent Direct Provider Usage
        shell: bash
        run: |
          echo "Checking for direct provider SDK usage..."

          if grep -R "OpenAIClient" src --include="*.cs"; then
            echo "Direct OpenAI SDK usage detected."
            exit 1
          fi

          if grep -R "AnthropicClient" src --include="*.cs"; then
            echo "Direct Anthropic SDK usage detected."
            exit 1
          fi

          echo "Provider abstraction check passed."

      - name: Verify Governance Principles
        run: |
          echo "✔ Business Rules before AI"
          echo "✔ Database before AI"
          echo "✔ Cache before AI"
          echo "✔ Hybrid RAG before AI"
          echo "✔ AI Gateway only"
          echo "✔ Validation required"
          echo "✔ Clinical Safety required"
          echo "✔ Audit required"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-governance-results
          path: |
            **/TestResults/**
            **/*.trx
          if-no-files-found: ignore