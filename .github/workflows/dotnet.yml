version: "1.0"

server:
  id: postgres
  name: PostgreSQL MCP
  enabled: true

connection:
  database: ChandanalaERP

access:
  mode: readonly

allowed_tables:
  - Medicines
  - Inventory
  - Suppliers
  - Customers
  - Categories

blocked_operations:
  - INSERT
  - UPDATE
  - DELETE
  - DROP
  - ALTER
  - TRUNCATE

query_limits:
  max_rows: 1000
  timeout_seconds: 30

governance:
  audit_logging: true

security:
  parameterized_queries_only: true