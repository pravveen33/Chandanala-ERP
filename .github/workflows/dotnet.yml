name: CHANDANALA CORE™ Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      # Explicitly pointing to your core web module
      run: dotnet restore Chandanala.ERP.Web/Chandanala.ERP.Web.csproj
      
    - name: Build Module
      run: dotnet build Chandanala.ERP.Web/Chandanala.ERP.Web.csproj --configuration Release --no-restore
      
    - name: Run Tests (Phase 5)
      # This enforces your quality gate
      run: dotnet test Chandanala.ERP.Web/Chandanala.ERP.Web.csproj --no-build --verbosity normal


