name: .NET Core ERP Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. PostgreSQL Service Container definition
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Build
        run: dotnet build --configuration Release
        
      # 2. Run Migrations pointing to the service container
      - name: Run Migrations
        env:
          CONNECTION_STRING: Host=postgres;Database=erp_db;Username=postgres;Password=password
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --connection "$CONNECTION_STRING"
