agent:
  id: code-generation-agent
  version: 1.0.0
  purpose: Generate implementation code
  capabilities:
    - code-generation
  permissions:
    - repository-read
    - branch-write
  prohibited:
    - production-deployment
    - billing-execution
    - inventory-update
  evaluation_profile:
    - repository-compliance
    - security-review
    - architecture-validation