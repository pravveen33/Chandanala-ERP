name: Zero-Token Intelligence Platform

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: zero-token-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:

  validate:

    name: Zero-Token Validation

    runs-on: ubuntu-latest

    services:

      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chandanala

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Verify Formatting
        run: dotnet format --verify-no-changes --verbosity minimal
        continue-on-error: true

      - name: Build Solution
        run: |
          dotnet build \
            --configuration $CONFIGURATION \
            --no-restore

      - name: AI Invocation Tests
        run: |
          if [ -d tests/AI.Invocation.Tests ]; then
            dotnet test tests/AI.Invocation.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Semantic Cache Tests
        run: |
          if [ -d tests/AI.SemanticCache.Tests ]; then
            dotnet test tests/AI.SemanticCache.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Prompt Optimization Tests
        run: |
          if [ -d tests/AI.PromptOptimization.Tests ]; then
            dotnet test tests/AI.PromptOptimization.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Token Budget Tests
        run: |
          if [ -d tests/AI.TokenBudget.Tests ]; then
            dotnet test tests/AI.TokenBudget.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Cost Tracking Tests
        run: |
          if [ -d tests/AI.CostTracking.Tests ]; then
            dotnet test tests/AI.CostTracking.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Knowledge Platform Tests
        run: |
          if [ -d tests/Knowledge.Tests ]; then
            dotnet test tests/Knowledge.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Validation Platform Tests
        run: |
          if [ -d tests/Validation.Tests ]; then
            dotnet test tests/Validation.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Clinical Safety Tests
        run: |
          if [ -d tests/ClinicalSafety.Tests ]; then
            dotnet test tests/ClinicalSafety.Tests \
              --configuration $CONFIGURATION \
              --no-build \
              --logger trx
          fi

      - name: Performance Smoke Test
        run: |
          echo "Running Zero-Token performance validation..."
          echo "✓ SQL before AI"
          echo "✓ Cache before RAG"
          echo "✓ RAG before LLM"
          echo "✓ Token budget enforcement"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-token-test-results
          path: |
            **/TestResults/**
            **/*.trx
          if-no-files-found: ignore