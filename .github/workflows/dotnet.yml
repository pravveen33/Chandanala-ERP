# CHANDANALA CORE™ - Zero Trust Agent Policy
policy_version: 1.0.0
enforcement_mode: strict

agents:
  ramanujan-coder:
    permissions:
      - read: ["/app/rules/*"]
      - write: ["/var/log/audit/"]
      - network_egress: "denied"
      - tool_access: ["gst_reconcile", "audit_log"]
    sandbox:
      readonly_root: true
      max_memory: 512MB
      
  compliance-judge:
    permissions:
      - read: ["/app/rules/*", "/var/log/audit/"]
      - network_egress: "denied"
    sandbox:
      readonly_root: true

global_guardrails:
  - no_internet_access: true
  - automated_sast_scan: enabled
  - tamper_proof_audit_spine: enabled
