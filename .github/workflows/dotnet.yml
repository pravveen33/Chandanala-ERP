version: "1.0"

server:
  id: openapi
  name: OpenAPI MCP
  enabled: true

gateway:
  type: CapabilityGateway

authentication:
  required: true

services:

  inventory:
    enabled: true

  medicine:
    enabled: true

  billing:
    enabled: true

  purchase:
    enabled: true

  supplier:
    enabled: true

  customer:
    enabled: true

  reporting:
    enabled: true

permissions:
  read: true
  write: false

governance:
  approval_required_for_write: true
  audit_logging: true

security:
  https_only: true