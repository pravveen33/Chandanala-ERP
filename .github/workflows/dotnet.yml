name: CHANDANALA CORE AI Governance Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  security-events: write

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:

  build:

    name: Build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $BUILD_CONFIGURATION --no-restore

  unit-tests:

    name: Unit Tests

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet test tests/UnitTests --configuration Release

  integration-tests:

    name: Integration Tests

    needs: unit-tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet test tests/IntegrationTests --configuration Release

  ai-evaluation:

    name: AI Evaluation

    needs: integration-tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Product Entry Evaluation
        run: dotnet test tests/AI/ProductEntryEvaluation

      - name: OCR Evaluation
        run: dotnet test tests/AI/OcrEvaluation

      - name: RAG Evaluation
        run: dotnet test tests/AI/RagEvaluation

      - name: Provider Evaluation
        run: dotnet test tests/AI/ProviderEvaluation

      - name: Hallucination Evaluation
        run: dotnet test tests/AI/HallucinationEvaluation

      - name: Clinical Safety Evaluation
        run: dotnet test tests/AI/ClinicalSafetyEvaluation

  security:

    name: Security Scan

    needs: ai-evaluation

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Dependency Audit
        run: dotnet list package --vulnerable

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2

  architecture:

    name: Architecture Validation

    needs: security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Validate Architecture Rules
        run: dotnet test tests/ArchitectureTests

  documentation:

    name: Documentation Check

    needs: architecture

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - run: echo "Validate ADRs, OpenAPI, README"

  deploy:

    name: Deploy

    if: github.ref == 'refs/heads/main'

    needs:
      - documentation

    runs-on: ubuntu-latest

    environment:

      name: production

    steps:

      - uses: actions/checkout@v4

      - name: Publish
        run: dotnet publish -c Release

      - name: Deploy
        run: echo "Deploy using Docker Compose / Production pipeline"