jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Chandanala.ERP.Web/Chandanala.ERP.Web.csproj
      
    - name: Build
      run: dotnet build Chandanala.ERP.Web/Chandanala.ERP.Web.csproj --configuration Release --no-restore

