name: CHANDANALA CORE CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: "9.0.x"
  CONFIGURATION: Release

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Format Check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore

      - name: Unit Tests
        run: dotnet test --configuration $CONFIGURATION --no-build --collect:"XPlat Code Coverage"

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

      - name: Publish Code Coverage
        uses: codecov/codecov-action@v5
        if: always()

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/TestResults"

  security:

    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  dependency-scan:

    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Vulnerability Audit
        run: dotnet list package --vulnerable --include-transitive

  migration-validation:

    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      - name: Validate EF Migrations
        run: dotnet ef migrations script --no-build

  quality-gate:

    runs-on: ubuntu-latest
    needs:
      - build-test
      - security
      - dependency-scan
      - migration-validation

    steps:
      - name: Quality Gate
        run: echo "✅ All quality gates passed."