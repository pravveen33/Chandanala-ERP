name: Analytics Platform

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:

  analytics:

    name: Analytics Validation

    runs-on: ubuntu-latest

    services:

      postgres:

        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chandanala

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            --configuration $BUILD_CONFIGURATION \
            --no-restore

      - name: Run Analytics Unit Tests
        run: |
          dotnet test tests/Analytics.UnitTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Run Forecast Tests
        run: |
          dotnet test tests/Analytics.ForecastingTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Run Feature Engineering Tests
        run: |
          dotnet test tests/Analytics.FeatureEngineeringTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Run Prediction Provider Tests
        run: |
          dotnet test tests/Analytics.ProviderTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Run Validation Integration Tests
        run: |
          dotnet test tests/Analytics.ValidationTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Run Performance Tests
        run: |
          dotnet test tests/Analytics.PerformanceTests \
            --configuration $BUILD_CONFIGURATION \
            --no-build

      - name: Upload Analytics Results
        uses: actions/upload-artifact@v4
        with:
          name: analytics-results
          path: TestResults/