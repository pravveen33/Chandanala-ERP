version: "1.0"

server:
  id: github
  name: GitHub MCP
  enabled: true

connection:
  authentication: oauth
  readonly: true

permissions:
  repositories:
    read: true
    write: false

  pull_requests:
    read: true
    write: false

  issues:
    read: true
    write: false

  workflows:
    read: true
    dispatch: false

  releases:
    read: true
    write: false

governance:
  approval_required: false
  audit_logging: true

security:
  allow_secret_access: false
  allow_admin_operations: false

telemetry:
  enabled: true