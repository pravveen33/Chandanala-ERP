name: CHANDANALA CORE - Fleet Engineering CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: "9.0.x"
  BUILD_CONFIGURATION: Release

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $BUILD_CONFIGURATION --no-restore

      - name: Test
        run: dotnet test --configuration $BUILD_CONFIGURATION --no-build --verbosity normal

      - name: Publish
        run: |
          dotnet publish src/Chandanala.ERP.Web \
            --configuration $BUILD_CONFIGURATION \
            --output publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chandanala-core
          path: publish