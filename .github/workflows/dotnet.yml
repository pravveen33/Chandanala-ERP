name: OpenAPI Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  api-contract:
    name: Validate API Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Verify OpenAPI Generation
        run: |
          echo "OpenAPI validation placeholder"
          echo "Replace this with Swashbuckle or NSwag generation once the API project is configured."