name: AI UX Validation

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ai-ux-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:

  ai-ux-validation:

    name: AI UX Platform Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Packages
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            --configuration $BUILD_CONFIGURATION \
            --no-restore

      - name: Explainability Tests
        run: |
          if [ -d "tests/AIUX.ExplainabilityTests" ]; then
            dotnet test tests/AIUX.ExplainabilityTests \
              --configuration $BUILD_CONFIGURATION \
              --no-build
          else
            echo "Explainability tests not found - skipping."
          fi

      - name: Citation Tests
        run: |
          if [ -d "tests/AIUX.CitationTests" ]; then
            dotnet test tests/AIUX.CitationTests \
              --configuration $BUILD_CONFIGURATION \
              --no-build
          else
            echo "Citation tests not found - skipping."
          fi

      - name: Confidence Tests
        run: |
          if [ -d "tests/AIUX.ConfidenceTests" ]; then
            dotnet test tests/AIUX.ConfidenceTests \
              --configuration $BUILD_CONFIGURATION \
              --no-build
          else
            echo "Confidence tests not found - skipping."
          fi

      - name: Recommendation Tests
        run: |
          if [ -d "tests/AIUX.RecommendationTests" ]; then
            dotnet test tests/AIUX.RecommendationTests \
              --configuration $BUILD_CONFIGURATION \
              --no-build
          else
            echo "Recommendation tests not found - skipping."
          fi

      - name: Approval Workflow Tests
        run: |
          if [ -d "tests/AIUX.ApprovalTests" ]; then
            dotnet test tests/AIUX.ApprovalTests \
              --configuration $BUILD_CONFIGURATION \
              --no-build
          else
            echo "Approval tests not found - skipping."
          fi

      - name: Accessibility Tests
        run: |
          echo "Accessibility validation"

      - name: UI Regression Tests
        run: |
          echo "UI regression validation"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ux-results
          path: |
            TestResults
            **/*.trx
          if-no-files-found: ignore