    Deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Ensure the build artifacts are available
      # If your build job runs in a separate process, you MUST download artifacts here
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: chandanala-erp-publish # Ensure this matches the name in your build job
          path: ./publish

      # 2. Deploy with Debugging Enabled
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Use specific directory target, avoid wildcards if possible for reliability
          source: "./publish/*"
          target: "/var/www/chandanala-erp/"
          debug: true # CRITICAL: This will show you exact path mapping errors
          strip_components: 1 # This removes the 'publish' folder from the remote path if needed
