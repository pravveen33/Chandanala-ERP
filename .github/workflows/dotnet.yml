name: .NET Core ERP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    # Crucial: Specify the path to your project
    - name: Restore dependencies
      run: dotnet restore Chandanala.ERP.Web/Chandanala.ERP.Web.csproj
      
    - name: Build
      run: dotnet build Chandanala.ERP.Web/Chandanala.ERP.Web.csproj --configuration Release --no-restore
