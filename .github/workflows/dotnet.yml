version: v1
code_review:
  # Minimum severity for Gemini to post comments (LOW, MEDIUM, HIGH)
  comment_severity_threshold: MEDIUM
  
  # Glob patterns for files/folders you want Gemini to ignore during reviews
  ignore_patterns:
    - "vendor/**"
    - "dist/**"
    - "*.min.js"
    - "package-lock.json"
