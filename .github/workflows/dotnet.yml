# ==========================================================
# CHANDANALA CORE™
# Enterprise Event Mesh Configuration
# Architecture v31.6
# ==========================================================

event-mesh:

  enabled: true

  architecture: hybrid

  broker:
    type: kafka
    cluster-mode: true
    replication-factor: 3
    partitions-default: 6
    retention-days: 30
    compression: zstd

  communication:

    synchronous:
      protocol:
        - REST
        - gRPC

    asynchronous:
      protocol:
        - Kafka

# ----------------------------------------------------------
# Command vs Event Policy
# ----------------------------------------------------------

commands:

  synchronous:

    - Login
    - Authenticate
    - CreateBill
    - UpdateInventory
    - ValidatePrescription
    - CalculateGST
    - ProcessPayment
    - ApprovePurchase

events:

  asynchronous:

    - BillCreated
    - BillCancelled
    - PaymentCompleted
    - StockAdjusted
    - StockTransferred
    - StockReserved
    - PurchaseApproved
    - GoodsReceived
    - PrescriptionUploaded
    - OCRCompleted
    - PharmacistReviewRequired
    - MedicineDispensed
    - CustomerRegistered
    - LoyaltyUpdated
    - DeliveryAssigned
    - DeliveryCompleted
    - AIRecommendationGenerated
    - ForecastCompleted

# ----------------------------------------------------------
# Event Schema Registry
# ----------------------------------------------------------

schema-registry:

  enabled: true

  compatibility: backward

  validation:
    required: true

  versioning:
    semantic: true

# ----------------------------------------------------------
# Event Metadata
# ----------------------------------------------------------

metadata:

  required:

    event-id: uuidv7
    event-version: true
    correlation-id: true
    causation-id: true
    tenant-id: true
    timestamp-utc: true
    source-service: true
    event-type: true
    schema-version: true
    payload-version: true

# ----------------------------------------------------------
# Domain Events
# ----------------------------------------------------------

domains:

  billing:

    events:
      - BillCreated
      - BillUpdated
      - BillCancelled
      - PaymentCompleted
      - RefundProcessed

  inventory:

    events:
      - StockReceived
      - StockAdjusted
      - StockReserved
      - StockReleased
      - StockTransferred
      - BatchExpired
      - ReorderTriggered

  prescription:

    events:
      - PrescriptionUploaded
      - OCRCompleted
      - PharmacistReviewRequired
      - PrescriptionValidated
      - PrescriptionRejected
      - MedicineDispensed

  purchasing:

    events:
      - PurchaseOrderCreated
      - PurchaseApproved
      - GoodsReceived
      - SupplierInvoiceProcessed

  customer:

    events:
      - CustomerRegistered
      - LoyaltyUpdated
      - RefillReminderCreated

  delivery:

    events:
      - DeliveryAssigned
      - DeliveryStarted
      - DeliveryCompleted

  ai:

    events:
      - OCRCompleted
      - AIRecommendationGenerated
      - InventoryForecastCompleted
      - ReportGenerated

  governance:

    events:
      - PolicyUpdated
      - RuleChanged
      - PromptReleased
      - ConfigurationChanged

# ----------------------------------------------------------
# Event Publishing
# ----------------------------------------------------------

publishing:

  transactional-outbox: true

  publish-after-commit: true

  idempotent: true

  ordering: partition

  retries:

    enabled: true

    max-attempts: 5

    exponential-backoff: true

# ----------------------------------------------------------
# Consumers
# ----------------------------------------------------------

consumers:

  notification-service:
    enabled: true

  ai-orchestrator:
    enabled: true

  analytics-service:
    enabled: true

  audit-service:
    enabled: true

  reporting-service:
    enabled: true

  dashboard-service:
    enabled: true

  search-service:
    enabled: true

  inventory-service:
    enabled: true

# ----------------------------------------------------------
# Reliability
# ----------------------------------------------------------

reliability:

  dead-letter-queue:
    enabled: true

  duplicate-detection:
    enabled: true

  poison-message-handling:
    enabled: true

  timeout-protection:
    enabled: true

  replay-support:
    enabled: true

# ----------------------------------------------------------
# Event Replay
# ----------------------------------------------------------

replay:

  enabled: true

  allowed:

    - analytics
    - dashboards
    - ai-training
    - search-index
    - reporting

  prohibited:

    - billing
    - payment
    - prescription-approval

# ----------------------------------------------------------
# AI Integration
# ----------------------------------------------------------

ai:

  consume-events: true

  publish-events: true

  triggers:

    StockAdjusted:
      action: InventoryForecast

    BillCreated:
      action: SalesAnalytics

    GoodsReceived:
      action: SupplierAnalysis

    PrescriptionUploaded:
      action: OCRPipeline

    OCRCompleted:
      action: PharmacistReview

# ----------------------------------------------------------
# Security
# ----------------------------------------------------------

security:

  authentication: required

  authorization: required

  encryption:
    in-transit: true

  tenant-isolation: true

  pii-masking: true

  payload-validation: true

  audit-log: mandatory

# ----------------------------------------------------------
# Observability
# ----------------------------------------------------------

observability:

  tracing:
    opentelemetry: true

  metrics:

    event-throughput: true
    consumer-lag: true
    processing-latency: true
    retry-count: true
    dlq-size: true
    replay-count: true
    event-failure-rate: true

# ----------------------------------------------------------
# Architecture Principles
# ----------------------------------------------------------

principles:

  - "Commands change state."
  - "Events describe completed state changes."
  - "Publish events only after successful transaction commit."
  - "Events are immutable."
  - "Every event is versioned."
  - "Every event is auditable."
  - "Every event is traceable."
  - "Every consumer must be idempotent."
  - "Business Rules Engine remains authoritative."
  - "Clinical Constraint Engine remains authoritative."
  - "AI consumes validated business events only."

# ==========================================================
# CHANDANALA CORE™ Event Mesh Standard
#
# REST/gRPC → Critical Transactions
# Kafka      → Business Events
#
# Event Flow:
# Command → Business Rules → Database Commit →
# Transactional Outbox → Kafka →
# AI / Analytics / Notifications / Audit / Reporting
#
# Business Rules are always the source of truth.
# ==========================================================