# ==========================================================
# CHANDANALA CORE™
# Master Architecture Configuration
# Version: 31.6
# ==========================================================

system:

  name: CHANDANALA CORE™

  version: 31.6

  architecture: enterprise

  deployment:
    environment: production

  pharmacy:
    type: retail

# ----------------------------------------------------------
# Feature Flags
# ----------------------------------------------------------

features:

  ai: true
  event-mesh: true
  knowledge-ops: true
  content-as-code: true
  workflow-engine: true
  audit: true
  monitoring: true
  feature-flags: true
  notifications: true
  analytics: true

# ----------------------------------------------------------
# AI Platform
# ----------------------------------------------------------

ai:

  orchestrator:
    enabled: true

  routing:
    dynamic: true
    failover: true

  providers:

    gpt:
      enabled: true
      status: production

    gemini:
      enabled: true
      status: production

    monolith:
      enabled: false
      status: experimental

    soofi:
      enabled: false
      status: experimental

    ollama:
      enabled: false
      status: optional

# ----------------------------------------------------------
# Event Mesh
# ----------------------------------------------------------

event-mesh:

  enabled: true

  broker: kafka

  transactional-outbox: true

  schema-registry: true

  replay: true

  dead-letter-queue: true

# ----------------------------------------------------------
# Governance
# ----------------------------------------------------------

governance:

  business-rules:
    enabled: true

  clinical-constraint-engine:
    enabled: true

  audit:
    mandatory: true

  approvals:
    mandatory: true

# ----------------------------------------------------------
# Content as Code
# ----------------------------------------------------------

content:

  prompts:
    versioned: true

  workflows:
    versioned: true

  policies:
    versioned: true

  rules:
    versioned: true

  knowledge:
    versioned: true

  configuration:
    versioned: true

# ----------------------------------------------------------
# KnowledgeOps
# ----------------------------------------------------------

knowledge:

  retrieval:

    order:
      - business-rules
      - clinical-policies
      - sop
      - knowledge-base
      - configuration
      - ai

  citations: required

# ----------------------------------------------------------
# Workflow Engine
# ----------------------------------------------------------

workflow:

  engine:

    enabled: true

    declarative: true

# ----------------------------------------------------------
# Observability
# ----------------------------------------------------------

observability:

  metrics: true

  tracing:

    opentelemetry: true

  logging:

    structured: true

# ----------------------------------------------------------
# Security
# ----------------------------------------------------------

security:

  authentication: oauth2

  authorization: rbac

  mfa: optional

  encryption:

    transit: true

    rest: true

# ----------------------------------------------------------
# Architecture Principles
# ----------------------------------------------------------

principles:

  - "Business Logic != AI Logic"
  - "Content is Code"
  - "Knowledge Before Generation"
  - "Rules Before AI"
  - "Policy Before Execution"
  - "Events After Successful Commit"
  - "Everything Versioned"
  - "Everything Auditable"
  - "Everything Observable"
  - "Everything Replaceable"