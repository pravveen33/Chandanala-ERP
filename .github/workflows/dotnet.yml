# ==========================================================
# CHANDANALA CORE™
# AI Provider Configuration
# Architecture v31.1
# ==========================================================

ai:

  enabled: true

  architecture:
    mode: multi-provider
    orchestrator: enabled
    dynamic-routing: true
    provider-adapter: true
    capability-routing: true
    failover: true
    feature-flags: true

  providers:

    gpt:
      enabled: true
      status: production
      priority: 100
      multimodal: true
      reasoning: excellent
      safety-approved: true

    gemini:
      enabled: true
      status: production
      priority: 90
      multimodal: true
      reasoning: excellent
      safety-approved: true

    monolith:
      enabled: false
      status: experimental
      priority: 70
      local-deployment: supported
      benchmark-required: true
      pharmacy-validation: required
      safety-approved: false

    ollama:
      enabled: false
      status: optional
      priority: 60
      local-ai: true

  capability-routing:

    inventory-intelligence:
      preferred:
        - monolith
        - gpt
      fallback:
        - gemini

    procurement-intelligence:
      preferred:
        - monolith
      fallback:
        - gpt

    sales-analytics:
      preferred:
        - monolith
      fallback:
        - gpt

    report-generation:
      preferred:
        - monolith
      fallback:
        - gpt

    document-summarization:
      preferred:
        - monolith
      fallback:
        - gpt

    employee-assistant:
      preferred:
        - monolith
      fallback:
        - gpt

    pharmacy-chat:
      preferred:
        - gpt
      fallback:
        - gemini

    prescription-ocr:
      preferred:
        - gemini
      fallback:
        - gpt

    clinical-review:
      preferred:
        - gpt
      fallback:
        - gemini

  governance:

    ai-never-decides:

      - prescription-approval
      - clinical-diagnosis
      - drug-interaction-final-decision
      - schedule-h-validation
      - schedule-h1-validation
      - schedule-x-validation
      - billing-approval
      - gst-final-calculation
      - inventory-writeoff
      - financial-approval
      - audit-approval

    human-approval-required: true
    pharmacist-validation-required: true
    business-rules-first: true
    clinical-constraint-engine: true
    audit-logging: mandatory

  benchmark:

    required: true

    metrics:
      accuracy: true
      hallucination-rate: true
      latency: true
      throughput: true
      token-usage: true
      cpu-usage: true
      memory-usage: true
      cost: true
      uptime: true

  monitoring:

    enabled: true

    collect:
      - provider
      - model-version
      - response-time
      - success-rate
      - error-rate
      - confidence-score
      - token-usage
      - estimated-cost
      - routing-decision
      - safety-result

  failover:

    enabled: true

    retry:
      attempts: 2
      timeout-seconds: 20

    fallback-order:
      - gpt
      - gemini
      - monolith

  deployment-policy:

    experimental:
      production-access: false

    production:
      benchmark-passed: true
      governance-approved: true
      safety-approved: true
      audit-approved: true

# ==========================================================
# CHANDANALA CORE™ Principle
#
# Business Logic ≠ AI Model
# AI Models are replaceable execution engines.
# ERP modules communicate only with the AI Orchestrator.
# ==========================================================