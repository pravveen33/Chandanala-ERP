    deploy:
  name: 🚀 Deploy CHANDANALA CORE™

  needs:
    - build
    - test
    - security

  if: github.ref == 'refs/heads/main'

  runs-on: ubuntu-latest

  environment:
    name: Production

  permissions:
    contents: read

  concurrency:
    group: production
    cancel-in-progress: false

  timeout-minutes: 20

  steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Publish Artifact
      uses: actions/download-artifact@v4
      with:
        name: chandanala-erp-publish
        path: publish

    - name: Verify Publish Output
      run: |
        echo "=== Publish Directory ==="
        ls -lah publish

    - name: Verify Required Files
      run: |
        test -f publish/Chandanala.ERP.dll
        echo "Publish verified."

    - name: Deploy Application
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "publish/*"
        target: "/var/www/chandanala-erp"
        strip_components: 1
        overwrite: true
        timeout: 120s
        debug: false

    - name: Restart ERP Service
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          sudo systemctl restart chandanala-erp
          sudo systemctl status chandanala-erp --no-pager

    - name: Verify Application Health
      run: |
        curl --fail https://erp.yourdomain.com/health

    - name: Verify Database Health
      run: |
        curl --fail https://erp.yourdomain.com/health/database

    - name: Verify Notification Service
      run: |
        curl --fail https://erp.yourdomain.com/health/notification

    - name: Deployment Completed
      run: |
        echo "CHANDANALA CORE™ deployed successfully."