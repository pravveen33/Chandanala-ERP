name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "./src/Chandanala.ERP.Web/Chandanala.ERP.Web.csproj"

      - name: Build
        run: dotnet build "./src/Chandanala.ERP.Web/Chandanala.ERP.Web.csproj" --configuration Release --no-restore