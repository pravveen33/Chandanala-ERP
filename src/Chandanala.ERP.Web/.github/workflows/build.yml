name: Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish ./src/Chandanala.ERP.Web/Chandanala.ERP.Web.csproj -c Release -o ./publish

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chandanala-core
          path: publish
