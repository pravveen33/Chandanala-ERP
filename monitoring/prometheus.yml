# CHANDANALA CORE™ — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: chandanala-core
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ═══════════════════════════════════════════════════════════════
  # CHANDANALA CORE API
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'chandanala-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL Exporter
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # ═══════════════════════════════════════════════════════════════
  # Redis Exporter
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # ═══════════════════════════════════════════════════════════════
  # Node Exporter (if running on VM)
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s